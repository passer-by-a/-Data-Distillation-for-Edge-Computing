dataset: cifar10
num_classes: 10
val_ratio: 0.02
split_seed: 42
vae_ckpt: checkpoints/autoencoder_edge_s8_c16.pt
cache_dir: vae_bdm/cache
results_dir: group_vae/results/cifar10
figures_dir: group_vae/figures/cifar10
protocol_version: group_vae_v1

group:
  size: 10
  strategy: random          # random | nearest | diverse
  resample: false
  fusion_stage: 8x8         # 8x8 (down[1] 之后) | 16x16 (down[0] 之后)
  fusion: film              # mean | attention | film
  attn_dim: 128
  attn_heads: 4
  attn_layers: 1
  film_hidden: 128

warmup:
  epochs: 20
  batch_classes: 4
  batch_groups_per_class: 4
  lr: 0.001
  weight_decay: 0.0001
  lambda_dm: 1.0
  lambda_var: 1.0
  lambda_gce: 1.0
  lambda_gkl: 0.0001
  holdout_frac: 0.05
  log_every: 20

joint:
  epochs: 5
  batch_classes: 4
  batch_groups_per_class: 4
  lr: 0.0002
  lambda_rec: 1.0
  lambda_kl: 0.0001
  lambda_cls: 0.1
  lambda_dm: 1.0
  lambda_var: 1.0
  lambda_gce: 1.0
  lambda_gkl: 0.0001
  log_every: 20

cloud:
  head: mlp
  epochs: 200
  lr: 0.001
  wd: 0.0001
  batch: 256
  val_mode: external
  training_budget:
    mode: fixed_epochs
    epochs: 200
  seeds: [0, 1, 2]

payload:
  label_bytes: 2
  bandwidth_mbps: 10.0

quant:
  modes: [fp32, fp16, int8]
