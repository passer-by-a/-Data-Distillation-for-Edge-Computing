# CIFAR-10 80 轮在线配对实验：一份边缘轨迹，四个云端分支
#   inc200 / inc20 / scratch200 / scratch20
# 与 cifar10_supervised_multi80_u2.yaml 的差异只在 cloud 分支配置；
# 数据流、VAE、DM/Reservoir、预算与 INT8 通信保持主表口径。
protocol_version: vae_streaming_v2_supervised80_multibranch
dataset: cifar10
num_classes: 10
val_ratio: 0.02
split_seed: 42
feature_dim: 1024
latent_dim: 16
base_channels: 64

stream:
  scenario: iid
  initial_fraction: 0.20
  num_rounds: 80
  shuffle_seed: 42
  class_balanced_initial: true
  label_mode: supervised_stream

vae:
  online_update: true
  initial_epochs: 30
  steps_per_round: 150
  update_every_rounds: 2
  batch_size: 128
  lr: 0.001
  beta: 1.0e-4
  cls_lambda: 0.1
  online_lr: 1.0e-3
  online_cls_lambda: 0.1
  replay_enabled: true
  replay_ratio: 0.25
  stability_enabled: false
  lambda_stab: 0.0
  augment: true
  seed: 42

memory:
  replay_strategy: class_balanced
  raw_replay_capacity: 1000
  representative_budget: 980
  representative_init: kmeans

alignment:
  method: diagonal_affine
  anchor_count: 200
  max_scale: 3.0

distillation:
  method: dm
  feature_hidden: 2048
  feature_out: 1024
  feature_seed: 0
  exact_target: true
  updates_per_class: 20
  lr: 0.01
  weight_decay: 0.0
  lambda_mean: 1.0
  lambda_anchor: 0.01
  seed: 42

communication:
  mode: full_sync
  quantization: int8
  patch_fraction: 0.10

cloud:
  head: mlp
  incremental_training: true
  short_steps: 20                # inc20 / scratch20
  # 与主配置保持同一键集合；本实验各分支使用固定步数，
  # multi_branch 会为该键为每个分支显式 pop，不影响分支步数。
  epochs_per_round: 5
  multi_branch: true
  branches:
    inc200_steps: 200
    inc20_steps: 20
    scratch200_steps: 200
    scratch20_steps: 20
  lr: 0.001
  wd: 0.0001
  batch: 256
  seed: 0
  val_mode: external
  epochs: 50
  # 验证集只做轮末评估，不参与轮内选优
  select_best_on_val: false

evaluation:
  per_round: true
  test_int8: true

results_dir: vae_streaming/results
checkpoints_dir: vae_streaming/checkpoints
figures_dir: vae_streaming/figures
